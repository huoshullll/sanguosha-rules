<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>三国杀规则整理</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" />
<style>
:root{
  --paper:#f4f0e6; --paper2:#fdfbf6; --ink:#1b1f23; --ink2:#5b646e; --ink3:#8c949d;
  --line:#e2dacc; --line2:#cfc6b4; --accent:#a4392c; --accent2:#8a6a3c;
  --soft:#f2e6df; --shadow:0 1px 2px rgba(30,26,20,.05),0 14px 30px -20px rgba(30,26,20,.4);
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
}
[data-theme="dark"]{
  --paper:#14171a; --paper2:#1b1f23; --ink:#e9e4d9; --ink2:#a6afb8; --ink3:#788188;
  --line:#2a3036; --line2:#3a4249; --accent:#d46a5b; --accent2:#c2a06a;
  --soft:#2c1e1b; --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 34px -22px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 500px at 90% -10%,rgba(0,0,0,.045),transparent 70%);
}
.bar{position:fixed;top:0;left:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);
  background:linear-gradient(90deg,var(--accent),var(--accent2));z-index:70}

/* ---------- hero ---------- */
.hero{
  position:relative;color:#ece7dd;overflow:hidden;
  background:
    radial-gradient(900px 320px at 82% -20%,rgba(164,57,44,.55),transparent 65%),
    radial-gradient(700px 260px at 10% 120%,rgba(138,106,60,.35),transparent 70%),
    linear-gradient(160deg,#1e2327 0%,#111518 72%);
  padding:64px 24px 40px;
}
.hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:100% 28px;
}
.hero-in{position:relative;z-index:2;max-width:1120px;margin:0 auto}
.kicker{font-size:12px;letter-spacing:.18em;color:#e6dfd0;font-weight:500;margin:0 0 14px;text-transform:uppercase}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(38px,7vw,64px);line-height:1.06;
  margin:0;letter-spacing:.02em}
.lede{margin:14px 0 0;color:#c8c2b5;font-weight:300;max-width:44em;font-size:15.5px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0 0}
.stat{display:flex;align-items:baseline;gap:7px;padding:7px 13px;border:1px solid rgba(255,255,255,.16);
  border-radius:999px;background:rgba(255,255,255,.045)}
.stat b{font-family:var(--serif);font-weight:600;font-size:18px;color:#f3ece0}
.stat span{font-size:12.5px;color:#a9a396;letter-spacing:.04em}
.search{position:relative;margin:26px 0 0;max-width:620px}
.search input{
  width:100%;padding:15px 18px 15px 46px;border-radius:12px;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.07);color:#f2eee6;font-size:15px;font-family:var(--sans);outline:none;
  transition:border-color .2s,background .2s,box-shadow .2s;
}
.search input::placeholder{color:#9d9789}
.search input:focus{background:rgba(255,255,255,.12);border-color:rgba(212,106,91,.7);
  box-shadow:0 0 0 4px rgba(212,106,91,.16)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:17px;height:17px;
  stroke:#b4ada0;fill:none;stroke-width:1.7}
.hint{margin:6px 0 0;font-size:12.5px;color:#b5ad9c;min-height:0;letter-spacing:.02em}

/* ---------- tabs ---------- */
.tabs{position:sticky;top:0;z-index:50;background:var(--paper);
  background:color-mix(in srgb,var(--paper) 86%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tabs-in{max-width:1120px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:0 16px;
  scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tabs a{flex:0 0 auto;padding:14px 15px 12px;font-size:14px;color:var(--ink2);text-decoration:none;
  border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--accent);border-bottom-color:var(--accent)}

/* ---------- layout ---------- */
main{max-width:1120px;margin:0 auto;padding:8px 24px 80px}
.sec{padding:44px 0 8px}
.sec-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.no{font-family:var(--serif);font-size:13px;color:#fff;background:var(--accent);
  width:26px;height:26px;display:inline-grid;place-items:center;border-radius:4px;
  align-self:center;font-weight:600;letter-spacing:.02em}
h2{font-family:var(--serif);font-size:clamp(23px,3.4vw,30px);margin:0;font-weight:600;letter-spacing:.01em}
.sec-head p{margin:0;color:var(--ink3);font-size:13.5px}

/* ---------- tag cards ---------- */
.tag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:14px;margin-top:22px}
.tagcard{
  display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:inherit;
  background:var(--paper2);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:11px;padding:16px 16px 13px;cursor:pointer;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.tagcard:hover,.tagcard:focus-visible{transform:translateY(-2px);box-shadow:var(--shadow);
  border-left-color:var(--accent2);outline:none}
.tag-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tag-name{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.02em}
.tag-num{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;
  border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.tag-sum{font-size:13.5px;color:var(--ink2);line-height:1.65}
.tag-more{font-size:12px;color:var(--accent);letter-spacing:.06em;margin-top:2px}

/* ---------- tables ---------- */
.termgroup{margin-top:30px}
.termgroup h3{font-family:var(--serif);font-size:17.5px;font-weight:600;margin:0 0 10px;
  color:var(--ink);letter-spacing:.02em}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:11px;background:var(--paper2)}
table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:520px}
thead th{font-size:12.5px;font-weight:600;color:var(--ink3);letter-spacing:.08em;text-align:left;
  padding:11px 15px;border-bottom:1px solid var(--line2);background:var(--soft);white-space:nowrap}
tbody td{padding:11px 15px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.7}
tbody tr:last-child td{border-bottom:none}
tbody tr:nth-child(even){background:rgba(0,0,0,.018)}
[data-theme="dark"] tbody tr:nth-child(even){background:rgba(255,255,255,.02)}
tbody tr{transition:background .12s}
tbody tr:hover{background:rgba(164,57,44,.055)}
[data-theme="dark"] tbody tr:hover{background:rgba(212,106,91,.09)}
td.k{font-family:var(--serif);font-weight:600;white-space:nowrap;font-size:15px;width:1%}
td.num,.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink2)}
td.subs{color:var(--ink2);font-size:13.5px}
.k-card{color:var(--accent);font-weight:500}
.k-skill{color:var(--accent2);font-weight:500}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;
  background:var(--soft);border-radius:4px;padding:1px 5px;color:var(--ink2)}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:10px 9px;margin-top:20px;align-items:center}
.chip{display:inline-flex;align-items:baseline;gap:6px;padding:5px 11px;border:1px solid var(--line);
  border-radius:999px;background:var(--paper2);line-height:1.4;font-family:inherit;color:inherit;
  cursor:pointer;transition:border-color .15s,transform .15s,background .15s}
.chip:hover{border-color:var(--accent);transform:translateY(-1px);background:var(--paper)}
.chip:active{transform:none}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip b{font-size:11px;font-weight:400;color:var(--ink3);font-variant-numeric:tabular-nums}
.chip.lg{font-size:20px;font-weight:600;padding:7px 15px;border-color:var(--line2)}
.chip.md{font-size:15.5px}
.chip.sm{font-size:12.5px;color:var(--ink2);padding:4px 10px}

/* ---------- 类型筛选 ---------- */
.tfilters{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.tbtn{display:inline-flex;align-items:baseline;gap:5px;padding:4px 11px;border:1px solid var(--line2);
  border-radius:999px;background:transparent;font-family:inherit;font-size:13px;color:var(--ink2);
  cursor:pointer;transition:border-color .15s,background .15s,color .15s}
.tbtn:hover{border-color:var(--accent);color:var(--ink)}
.tbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tbtn.on b{color:rgba(255,255,255,.8)}
.tbtn b{font-size:11px;font-weight:400;color:var(--ink3);font-variant-numeric:tabular-nums}
.tbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- misc blocks ---------- */
.note{margin-top:20px;padding:14px 16px;border-left:3px solid var(--accent2);
  background:var(--soft);border-radius:0 8px 8px 0;font-size:13.5px;color:var(--ink2)}
.note p{margin:0 0 6px}
.note p:last-child{margin:0}
.note ul{margin:6px 0 0 18px;padding:0}
.empty{margin:18px 0 0;color:var(--ink3);font-size:14px}
.about{max-width:78ch;margin-top:20px;font-size:14.5px;color:var(--ink2)}
.about p{margin:0 0 12px}
.about strong{color:var(--ink)}
.about li.num-item{margin:6px 0 6px 4px;list-style:none;padding-left:22px;position:relative}
.about li.num-item::before{content:"·";position:absolute;left:8px;color:var(--accent)}

/* ---------- sheet / dialog ---------- */
.sheet{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:22px}
.veil{position:absolute;inset:0;background:rgba(12,15,17,.62);backdrop-filter:blur(3px)}
.dialog{position:relative;z-index:2;width:100%;max-width:660px;max-height:84vh;overflow:auto;
  background:var(--paper2);border-radius:15px;padding:30px 32px 26px;
  box-shadow:0 30px 80px -30px rgba(0,0,0,.7);animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.d-head{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);
  padding-bottom:14px;margin-bottom:18px}
.d-head h3{font-family:var(--serif);font-size:24px;margin:0;font-weight:600}
.d-count{font-size:12px;color:var(--ink3);border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;margin-left:auto}
.x{position:absolute;top:12px;right:14px;border:0;background:none;font-size:22px;line-height:1;
  color:var(--ink3);cursor:pointer;padding:6px}
.x:hover{color:var(--accent)}
.d-body{font-size:14.8px;color:var(--ink)}
.d-body p{margin:0 0 13px}
.d-body ul{margin:8px 0 14px 20px;padding:0}
.d-body li{margin:0 0 7px}
.d-body li::marker{color:var(--accent)}
.d-body strong{color:var(--ink);font-weight:600}
.d-body code{font-size:12.5px}
.d-meta{display:flex;flex-wrap:wrap;gap:7px;margin:-4px 0 15px}
.badge{font-size:12px;color:var(--ink2);background:var(--soft);border-radius:999px;padding:3px 10px;
  letter-spacing:.01em}
.badge.type{color:var(--accent);background:transparent;border:1px solid var(--accent2)}
.cdesc{font-size:14.6px;line-height:1.95;color:var(--ink)}
.cdesc b{font-weight:600;color:var(--accent)}
.cdesc .kc{background:var(--soft);border-radius:3px;padding:0 1px;white-space:nowrap}
.cdesc br{display:block;margin-top:3px;content:""}
.cdesc .cr{color:#b23b2e}
.cdesc .cb{color:#3a5f9e}
.cdesc .cg{color:#4c7a51}
.cnote{margin-top:16px;padding:10px 13px;border-left:2px solid var(--accent2);background:var(--soft);
  font-size:12.8px;line-height:1.7;color:var(--ink2);border-radius:0 6px 6px 0}
.cref{margin-top:16px;padding:10px 13px;border-left:2px solid var(--accent);background:var(--soft);
  font-size:12.8px;line-height:1.9;color:var(--ink2);border-radius:0 6px 6px 0}
.cref b{display:block;margin-bottom:2px;font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.4px}
.refitem{display:inline-block;margin-right:12px;white-space:nowrap;color:var(--ink)}
.refitem i{font-style:normal;color:var(--accent2)}

/* ---------- fabs ---------- */
.fab{position:fixed;right:20px;z-index:60;width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line2);background:var(--paper2);color:var(--ink2);cursor:pointer;
  font-size:15px;display:grid;place-items:center;box-shadow:var(--shadow);
  transition:opacity .2s,transform .2s,color .2s}
.fab:hover{color:var(--accent);transform:translateY(-2px)}
.theme{bottom:74px}
.top{bottom:20px;opacity:0;pointer-events:none;font-size:18px}
.top.show{opacity:1;pointer-events:auto}

footer{border-top:1px solid var(--line);padding:26px 24px 34px;color:var(--ink3);font-size:12.5px}
footer div{max-width:1120px;margin:0 auto;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* ---------- responsive ---------- */
@media (max-width:760px){
  body{font-size:15px}
  .hero{padding:44px 18px 30px}
  .lede{font-size:14px}
  .stats{gap:8px}
  .stat{padding:6px 11px}
  .stat b{font-size:16px}
  .tabs-in{padding:0 8px}
  .tabs a{padding:12px 11px 10px;font-size:13px}
  main{padding:4px 16px 64px}
  .sec{padding:34px 0 6px}
  .tag-grid{grid-template-columns:1fr;gap:11px}
  .dialog{padding:24px 20px 20px;max-height:88vh}
  .d-head h3{font-size:20px}
  table{min-width:460px;font-size:13.5px}
  thead th,tbody td{padding:9px 11px}
  .chip.lg{font-size:17px}
}
@media print{
  .tabs,.fab,.search,.bar,.sheet{display:none!important}
  body{background:#fff}
  .hero{color:#111;background:none;border-bottom:1px solid #ccc}
}
</style>
</head>
<body>
<div class="bar" id="bar"></div>

<header class="hero">
  <div class="hero-in">
    <h1>三国杀规则整理</h1>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="搜索标签 / 词条 / 牌名，如 蓄力技、判定、影" />
    </div>
    <p class="hint" id="hint"></p>
  </div>
</header>

<nav class="tabs" id="tabs">
  <div class="tabs-in">
    <a href="#tags" class="on">技能标签</a>
    <a href="#terms">规则词条</a>
    <a href="#mech">机制词条</a>
    <a href="#cards">卡牌速查</a>
    </div>
</nav>

<main>
  <section class="sec" id="tags">
    <div class="sec-head">
      <span class="no">一</span><h2>技能标签</h2>
      <p>点卡片看完整释义；右上角数字为库内条数。</p>
    </div>
    <div class="tag-grid" id="tagGrid"></div>
    <p class="empty" id="tagsEmpty" hidden>没有匹配的标签，换个词试试。</p>
    <div class="note" id="tagNote"></div>
  </section>

  <section class="sec" id="terms">
    <div class="sec-head">
      <span class="no">二</span><h2>通用规则词条</h2>
      <p>回合阶段、区域、牌的类别、结算、体力伤害、距离范围、身份势力。</p>
    </div>
    <div id="termWrap"></div>
    <p class="empty" id="termsEmpty" hidden>这一节没有匹配的词条，试试「阶段」「距离」。</p>
  </section>

  <section class="sec" id="mech">
    <div class="sec-head">
      <span class="no">三</span><h2>机制词条</h2>
      <p>源码里独有的资源、状态与判定，三国杀通用规则之外的部分。</p>
    </div>
    <div id="mechWrap"></div>
    <p class="empty" id="mechEmpty" hidden>这一节没有匹配的机制，试试「蓄力点」「谋略」。</p>
  </section>

  <section class="sec" id="cards">
    <div class="sec-head">
      <span class="no">四</span><h2>卡牌速查</h2>
      <p>技能描述里以【】引用过的牌名，字号越大被提到越多；点牌名看它的效果，上方可按类型筛。</p>
    </div>
    <div class="tfilters" id="typeWrap"></div>
    <div class="chips" id="chipWrap"></div>
    <p class="empty" id="cardsEmpty" hidden>没有匹配的牌名。</p>
  </section>

</main>

<footer>
  <div>
    <span>数据来源：新月杀、官方规则集</span>
  </div>
</footer>

<div class="sheet" id="sheet" hidden>
  <div class="veil" data-close></div>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <button class="x" data-close aria-label="关闭">×</button>
    <div class="d-head"><h3 id="dTitle"></h3><span class="d-count" id="dCount"></span></div>
    <div class="d-meta" id="dMeta" hidden></div>
    <div class="d-body" id="dBody"></div>
  </div>
</div>

<button class="fab theme" id="theme" aria-label="切换明暗">暗</button>
<button class="fab top" id="top" aria-label="回到顶部">↑</button>

<script>
const DATA = {"tags":[{"name":"锁定技","count":"1065","sum":"满足条件必须发动","body":"<p><strong>满足条件必须发动的技能</strong>：条件满足就必须执行，玩家不能声明“我不发动”，描述里通常也不写“可以”。</p><ul><li>例：马超<span class=\"k-skill\">〖马术〗</span>“锁定技，你与其他角色的距离-1”——没有开关，永久生效。</li><li>注意：曾经无任何效果，仅仅只是一种标签；现在约定俗成为强制性技能，一般描述内没有“可以”字样。</li></ul>","search":"满足条件必须发动的技能 ：条件满足就必须执行，玩家不能声明“我不发动”，描述里通常也不写“可以”。 例：马超 〖马术〗 “锁定技，你与其他角色的距离-1”——没有开关，永久生效。 注意：曾经无任何效果，仅仅只是一种标签；现在约定俗成为强制性技能，一般描述内没有“可以”字样。"},{"name":"限定技","count":"225","sum":"整局游戏限发动一次，发动后失效","body":"<p>整局游戏<strong>只能发动一次</strong>，发动后该技能不再可用（多数实现里直接失效）。若描述另写“每局游戏限X次”，以描述为准。</p><ul><li>例：庞统<span class=\"k-skill\">〖涅槃〗</span>一旦触发，本局不再有第二次。</li><li>常见组合：“限定技，出牌阶段，你可以…”——发动时机也受限。</li></ul>","search":"限定技整局游戏限发动一次，发动后失效整局游戏只能发动一次，发动后该技能不再可用（多数实现里直接失效）。若描述另写&quot;每局游戏限x次&quot;，以描述为准。- 例：庞统〖涅槃〗一旦触发，本局不再有第二次。- 常见组合：&quot;限定技，出牌阶段，你可以…&quot;——发动时机也受限。"},{"name":"主公技","count":"95","sum":"身份为主公时才能从自身武将牌上获得","body":"<p><strong>身份为主公时才能从自身武将牌上获得的技能。</strong></p><ul><li>例：曹操<span class=\"k-skill\">〖护驾〗</span>“主公技，当你需要使用或打出<span class=\"k-card\">【闪】</span>时，你可以令其他魏势力角色选择是否打出一张<span class=\"k-card\">【闪】</span>”。</li><li>例：袁术<span class=\"k-skill\">〖觊玺〗</span>获得尚未觉醒的主公刘禅的<span class=\"k-skill\">〖若愚〗</span>，之后刘禅无论怎么变，袁术的〖若愚〗都照常可用。</li><li>注意：如果局内通过其他方式获得主公技，可正常发动。</li><li>库内常与“势力”一起出现，判断时先看势力再看身份。</li></ul>","search":"身份为主公时才能从自身武将牌上获得的技能。 例：曹操 〖护驾〗 “主公技，当你需要使用或打出 【闪】 时，你可以令其他魏势力角色选择是否打出一张 【闪】 ”。 例：袁术 〖觊玺〗 获得尚未觉醒的主公刘禅的 〖若愚〗 ，之后刘禅无论怎么变，袁术的〖若愚〗都照常可用。 注意：如果局内通过其他方式获得主公技，可正常发动。 库内常与“势力”一起出现，判断时先看势力再看身份。"},{"name":"觉醒技","count":"94","sum":"满足条件必须发动的变体锁定技，多用减体力上限换新技能","body":"<p><strong>锁定技的变体</strong>：满足觉醒条件后必须发动，不能拒绝。发动后一般要“减1点体力上限”作为代价，并永久获得一个新技能，整局限一次。</p><ul><li>例：邓艾<span class=\"k-skill\">〖凿险〗</span>“觉醒技，准备阶段，若&#x27;田&#x27;的数量不少于3张，你减1点体力上限，然后获得<span class=\"k-skill\">〖急袭〗</span>”。</li><li>读法：条件（田≥3）→ 代价（减上限）→ 收益（获得技能）。</li></ul><p><strong>官方定义更直接</strong>：规则集把“觉醒技”视为<strong>同时附带“锁定技”和“限定技”两个标签</strong>——牌面只写“觉醒技”三个字，含义等于写全“觉醒技，锁定技，限定技”。所以“必须发动”来自锁定技，“整局一次”来自限定技，描述里不重复写是省略，不是例外。</p>","search":"觉醒技锁定技的变体 ：满足觉醒条件后必须发动，不能拒绝。发动后一般要“减1点体力上限”作为代价，并永久获得一个新技能，整局限一次。 例：邓艾 〖凿险〗 “觉醒技，准备阶段，若&#x27;田&#x27;的数量不少于3张，你减1点体力上限，然后获得 〖急袭〗 ”。 读法：条件（田≥3）→ 代价（减上限）→ 收益（获得技能）。 官方定义更直接 ：规则集把“觉醒技”视为 同时附带“锁定技”和“限定技”两个标签 ——牌面只写“觉醒技”三个字，含义等于写全“觉醒技，锁定技，限定技”。所以“必须发动”来自锁定技，“整局一次”来自限定技，描述里不重复写是省略，不是例外。"},{"name":"主/副将技","count":"0","sum":"只有这张武将牌处在主将/副将位时才生效（国战双将）","body":"<p><strong>官方标签</strong>：只有当这张武将牌处于<strong>主将</strong>（或<strong>副将</strong>）位置时，带这个标签的技能才有效。</p><ul><li>只出现在国战这种“双将合体”的模式里：主将在左、副将在右，位置决定技能算不算存在。</li><li>库内暂 0 条：现有数据中没有带此标签的技能，释义取自官方规则集 V1.0。</li></ul>","search":"主/副将技官方标签 ：只有当这张武将牌处于 主将 （或 副将 ）位置时，带这个标签的技能才有效。 只出现在国战这种“双将合体”的模式里：主将在左、副将在右，位置决定技能算不算存在。 库内暂 0 条：现有数据中没有带此标签的技能，释义取自官方规则集 v1.0。"},{"name":"阵法技","count":"0","sum":"以座次关系为条件，角色数少于 4 时整体无效","body":"<p><strong>官方标签</strong>，四个特点：①触发类阵法技能发就必须发；②状态类阵法技若能产生影响就必须产生影响；③<strong>角色数小于 4 时阵法技无效</strong>；④以角色的座次关系（相邻、围攻、队列）作为条件。</p><ul><li>配套操作叫“阵法召唤”，释义见「3.8 官方规则集用语」。</li><li>库内暂 0 条：现有数据中没有带此标签的技能。</li></ul>","search":"阵法技官方标签 ，四个特点：①触发类阵法技能发就必须发；②状态类阵法技若能产生影响就必须产生影响；③ 角色数小于 4 时阵法技无效 ；④以角色的座次关系（相邻、围攻、队列）作为条件。 配套操作叫“阵法召唤”，释义见「3.8 官方规则集用语」。 库内暂 0 条：现有数据中没有带此标签的技能。"},{"name":"奥秘技","count":"0","sum":"暗置武将牌的技能，发动时不声明、直接执行","body":"<p><strong>官方标签</strong>：一名角色发动其一张<strong>暗置状态</strong>武将牌的奥秘技，即其<strong>不声明发动</strong>此技能，直接执行技能的效果。</p><ul><li>和“暗置”配套看：暗置武将牌的状态类技能无效、强制发动的技能也可以不发动，奥秘技则是“闷着直接生效”。</li><li>库内暂 0 条：现有数据中没有带此标签的技能。</li></ul>","search":"奥秘技官方标签 ：一名角色发动其一张 暗置状态 武将牌的奥秘技，即其 不声明发动 此技能，直接执行技能的效果。 和“暗置”配套看：暗置武将牌的状态类技能无效、强制发动的技能也可以不发动，奥秘技则是“闷着直接生效”。 库内暂 0 条：现有数据中没有带此标签的技能。"},{"name":"转换技","count":"69","sum":"有“阳/阴”两态，发动后自动切换","body":"<p>一条技能带<strong>两种形态</strong>，描述里以“阳：…”“阴：…”分段，同一时间只有一种生效。每次发动后自动切换到另一形态（阳→阴→阳……）。客户端按 <code>_yang</code>/<code>_yin</code> 两套描述分别显示当前形态。</p><ul><li>例：蒯良蒯越<span class=\"k-skill\">〖审时〗</span>阳面给牌打伤害，阴面看牌还牌，来回切。</li><li>与“韵律技”的区别：转换技只有两态且靠“发动”切换；韵律技靠单独满足“转韵”条件切换。</li></ul>","search":"转换技有&quot;阳/阴&quot;两态，发动后自动切换一条技能带两种形态，描述里以&quot;阳：…&quot;&quot;阴：…&quot;分段，同一时间只有一种生效。每次发动后自动切换到另一形态（阳→阴→阳……）。客户端按 _yang/_yin 两套描述分别显示当前形态。- 例：蒯良蒯越〖审时〗阳面给牌打伤害，阴面看牌还牌，来回切。- 与&quot;韵律技&quot;的区别：转换技只有两态且靠&quot;发动&quot;切换；韵律技靠单独满足&quot;转韵&quot;条件切换。"},{"name":"宗族技","count":"43","sum":"绑定“同族”关系，同族角色常共享同一技能","body":"<p>与“宗族/同族”关系绑定的技能。同一宗族的武将往往<strong>共享同一个技能名</strong>（族陈群、族陈泰都带<span class=\"k-skill\">〖士则〗</span>），效果多以“同族角色”为对象或判定条件。</p><ul><li>例：族陈群<span class=\"k-skill\">〖士则〗</span>“宗族技，锁定技，你于回合内使用牌首次被响应后，你令一名同族角色攻击范围+1”。</li><li>读法：先确认谁是“同族”（同一宗族标签的角色），再看效果落到谁身上。</li></ul>","search":"宗族技绑定&quot;同族&quot;关系，同族角色常共享同一技能与&quot;宗族/同族&quot;关系绑定的技能。同一宗族的武将往往共享同一个技能名（族陈群、族陈泰都带〖士则〗），效果多以&quot;同族角色&quot;为对象或判定条件。- 例：族陈群〖士则〗&quot;宗族技，锁定技，你于回合内使用牌首次被响应后，你令一名同族角色攻击范围+1&quot;。- 读法：先确认谁是&quot;同族&quot;（同一宗族标签的角色），再看效果落到谁身上。"},{"name":"势力技","count":"23","sum":"绑定某一势力，只有该势力下才生效","body":"<p>绑定具体势力的技能，描述开头会写成“魏势力技”“蜀势力技”“群势力技”等（库内统一归为“势力技”）。只有持有者当前势力与之相符时才生效，势力变更后生效的技能也随之改变。</p><ul><li>例：姜维同时带<span class=\"k-skill\">〖复谋〗</span>（魏势力技）与<span class=\"k-skill\">〖选锋〗</span>（蜀势力技），换势力等于换一套技能。</li><li>库内出现的势力前缀：魏、蜀、吴、群、晋、秦、魔、汉、西。</li></ul>","search":"势力技绑定某一势力，只有该势力下才生效绑定具体势力的技能，描述开头会写成&quot;魏势力技&quot;&quot;蜀势力技&quot;&quot;群势力技&quot;等（库内统一归为&quot;势力技&quot;）。只有持有者当前势力与之相符时才生效，势力变更后生效的技能也随之改变。- 例：姜维同时带〖复谋〗（魏势力技）与〖选锋〗（蜀势力技），换势力等于换一套技能。- 库内出现的势力前缀：魏、蜀、吴、群、晋、秦、魔、汉、西。"},{"name":"使命技","count":"22","sum":"带“成功/失败”两种结局的分支技能","body":"<p>带分支结局的技能：描述里用“⬤ 成功：…”“⬤ 失败：…”给出两条出路。达成成功条件后原技能失效并结算奖励（常获得新技能）；触发失败条件则吃惩罚。</p><ul><li>例：王凌<span class=\"k-skill\">〖秘备〗</span>成功则从牌堆按类别取牌并获<span class=\"k-skill\">〖谋立〗</span>；失败则减体力上限且使命失败。</li><li>国际服同名词条给的口径是：“在成功后失效，完成前有一定的惩罚。”</li></ul>","search":"使命技带&quot;成功/失败&quot;两种结局的分支技能带分支结局的技能：描述里用&quot;⬤ 成功：…&quot;&quot;⬤ 失败：…&quot;给出两条出路。达成成功条件后原技能失效并结算奖励（常获得新技能）；触发失败条件则吃惩罚。- 例：王凌〖秘备〗成功则从牌堆按类别取牌并获〖谋立〗；失败则减体力上限且使命失败。- 国际服同名词条给的口径是：&quot;在成功后失效，完成前有一定的惩罚。&quot;"},{"name":"蓄力技","count":"12","sum":"靠“蓄力点”存量发动，写作“蓄力技（当前/上限）”","body":"<p>围绕“蓄力点”运作的技能，标题写成“蓄力技（当前/上限）”，如<span class=\"k-skill\">〖奇制〗</span>写作“蓄力技（1/2）”。</p><ul><li>蓄力点是角色身上的独立资源：技能效果可“获得/消耗蓄力点”，上限由括号第二个数字给出（如 0/0 表示从零开始攒）。</li><li>消耗蓄力点通常换来更强或更多的效果；攒满往往另有奖励（例：势邓艾<span class=\"k-skill\">〖屯田〗</span>蓄力点满则摸牌且上限+1）。</li><li>客户端把该资源显示为“蓄力 x/y”。</li></ul>","search":"蓄力技靠&quot;蓄力点&quot;存量发动，写作&quot;蓄力技（当前/上限）&quot;围绕&quot;蓄力点&quot;运作的技能，标题写成&quot;蓄力技（当前/上限）&quot;，如〖奇制〗写作&quot;蓄力技（1/2）&quot;。- 蓄力点是角色身上的独立资源：技能效果可&quot;获得/消耗蓄力点&quot;，上限由括号第二个数字给出（如 0/0 表示从零开始攒）。- 消耗蓄力点通常换来更强或更多的效果；攒满往往另有奖励（例：势邓艾〖屯田〗蓄力点满则摸牌且上限+1）。- 客户端把该资源显示为&quot;蓄力 x/y&quot;。"},{"name":"隐匿技","count":"8","sum":"武将以隐匿状态登场，翻明（登场）后才生效","body":"<p>武将以“隐匿”状态存在（武将牌未翻明），在特定时机“登场”后才开始生效。库内这类技能几乎都带“当你于其他角色的回合登场后”的触发语。</p><ul><li>例：司马师<span class=\"k-skill\">〖不臣〗</span>“隐匿技，当你于其他角色的回合登场后，你可以令其本回合的手牌上限-2”。</li><li>与“登场势力”配套：部分武将写“你的登场势力为魏/蜀”，即翻明时按该势力结算。</li></ul>","search":"隐匿技武将以隐匿状态登场，翻明（登场）后才生效武将以&quot;隐匿&quot;状态存在（武将牌未翻明），在特定时机&quot;登场&quot;后才开始生效。库内这类技能几乎都带&quot;当你于其他角色的回合登场后&quot;的触发语。- 例：司马师〖不臣〗&quot;隐匿技，当你于其他角色的回合登场后，你可以令其本回合的手牌上限-2&quot;。- 与&quot;登场势力&quot;配套：部分武将写&quot;你的登场势力为魏/蜀&quot;，即翻明时按该势力结算。"},{"name":"连招技","count":"8","sum":"先后用两张指定属性的牌构成连招时触发","body":"<p>标题括号里给两个条件，如“连招技（装备牌+锦囊牌）”“连招技（伤害牌+<span class=\"k-card\">【杀】</span>）”“连招技（任意两张同名牌）”。含义是：你<strong>先用一张满足前一个条件的牌，再用一张满足后一个条件的牌</strong>，第二张牌的结算过程中该技能触发。</p><ul><li>例：威董卓<span class=\"k-skill\">〖据陲〗</span>“连招技（装备牌+锦囊牌）”——本回合先出装备牌、再出锦囊牌，锦囊结算时可选目标执行效果。</li><li>读法：括号是“前一张/后一张”，不是“同时满足两者”。</li></ul>","search":"连招技先后用两张指定属性的牌构成连招时触发标题括号里给两个条件，如&quot;连招技（装备牌+锦囊牌）&quot;&quot;连招技（伤害牌+【杀】）&quot;&quot;连招技（任意两张同名牌）&quot;。含义是：你先用一张满足前一个条件的牌，再用一张满足后一个条件的牌，第二张牌的结算过程中该技能触发。- 例：威董卓〖据陲〗&quot;连招技（装备牌+锦囊牌）&quot;——本回合先出装备牌、再出锦囊牌，锦囊结算时可选目标执行效果。- 读法：括号是&quot;前一张/后一张&quot;，不是&quot;同时满足两者&quot;。"},{"name":"持恒技","count":"7","sum":"效果持续存在、累积，不因技能失效而中断","body":"<p>效果一旦产生就<strong>持续保留并累积</strong>，不因技能失效、被获得/失去而中断。常见于靠长期累积数值（如道心值）解锁效果的武将。</p><ul><li>例：曹髦<span class=\"k-skill\">〖潜龙〗</span>“持恒技，游戏开始时，你获得20点道心值…你根据道心值视为拥有以下技能”——道心值一路累积，25/50/75/99 各解锁一条技能。</li><li>持恒技可与别的标签叠加，如司马昭<span class=\"k-skill\">〖昭凶〗</span>“持恒技，限定技，…”。</li></ul>","search":"持恒技效果持续存在、累积，不因技能失效而中断效果一旦产生就持续保留并累积，不因技能失效、被获得/失去而中断。常见于靠长期累积数值（如道心值）解锁效果的武将。- 例：曹髦〖潜龙〗&quot;持恒技，游戏开始时，你获得20点道心值…你根据道心值视为拥有以下技能&quot;——道心值一路累积，25/50/75/99 各解锁一条技能。- 持恒技可与别的标签叠加，如司马昭〖昭凶〗&quot;持恒技，限定技，…&quot;。"},{"name":"奋武技","count":"5","sum":"每轮可发动次数 =（本轮造成+受到的伤害）+1，至多 5 次","body":"<p>每轮可发动的次数 =（本轮你造成和受到的伤害值）+1，至多 5 次——打得越凶，这一轮能用得越多，每轮重新计算。</p><ul><li>例：极关羽<span class=\"k-skill\">〖武威〗</span>、极典韦<span class=\"k-skill\">〖亢勇〗</span>、极赵云<span class=\"k-skill\">〖龙翊〗</span>。</li><li>读法：属于“回合内爆发曲线”，一轮打不出伤害就只有 1 次机会。</li></ul>","search":"奋武技每轮可发动次数 =（本轮造成+受到的伤害）+1，至多 5 次每轮可发动的次数 =（本轮你造成和受到的伤害值）+1，至多 5 次——打得越凶，这一轮能用得越多，每轮重新计算。- 例：极关羽〖武威〗、极典韦〖亢勇〗、极赵云〖龙翊〗。- 读法：属于&quot;回合内爆发曲线&quot;，一轮打不出伤害就只有 1 次机会。"},{"name":"移志技","count":"4","sum":"有“昔/今”两态，执行“移志”后切换","body":"<p>一条技能带“昔”“今”两种状态，同一时间只有一种效果生效，初始为“昔”。执行“移志”后切换到另一态；<strong>如无额外说明，每局只能移志一次</strong>（技能写明“不受次数限制”的除外）。</p><ul><li>例：志刘禅<span class=\"k-skill\">〖图治〗</span>“昔：只有出牌阶段的额外回合；今：没有出牌阶段的额外回合”。</li><li>读法：移志＝换挡，不是叠加。</li></ul>","search":"移志技有&quot;昔/今&quot;两态，执行&quot;移志&quot;后切换一条技能带&quot;昔&quot;&quot;今&quot;两种状态，同一时间只有一种效果生效，初始为&quot;昔&quot;。执行&quot;移志&quot;后切换到另一态；如无额外说明，每局只能移志一次（技能写明&quot;不受次数限制&quot;的除外）。- 例：志刘禅〖图治〗&quot;昔：只有出牌阶段的额外回合；今：没有出牌阶段的额外回合&quot;。- 读法：移志＝换挡，不是叠加。"},{"name":"韵律技","count":"4","sum":"有“平/仄”两韵，满足“转韵”条件即切换","body":"<p>带“平”“仄”两韵的技能，描述分“平：…”“仄：…”两段，靠<strong>转韵</strong>切换，切换后技能发动次数重置（转韵条件写在技能末尾，如“转韵：出牌阶段，使用本回合未使用过的类型的牌”）。</p><ul><li>例：极小乔<span class=\"k-skill\">〖同心〗</span>平韵要牌、仄韵给牌打伤害。</li><li>与转换技的差别：韵律技的切换条件是独立事件，可反复转；转换技是“发动即切”。</li></ul>","search":"韵律技有&quot;平/仄&quot;两韵，满足&quot;转韵&quot;条件即切换带&quot;平&quot;&quot;仄&quot;两韵的技能，描述分&quot;平：…&quot;&quot;仄：…&quot;两段，靠转韵切换，切换后技能发动次数重置（转韵条件写在技能末尾，如&quot;转韵：出牌阶段，使用本回合未使用过的类型的牌&quot;）。- 例：极小乔〖同心〗平韵要牌、仄韵给牌打伤害。- 与转换技的差别：韵律技的切换条件是独立事件，可反复转；转换技是&quot;发动即切&quot;。"},{"name":"成器技","count":"3","sum":"写作“成器（N）”，N 为本局发动次数上限，每次发动后须满足“进学”条件才能继续","body":"<p>写作“成器（N）”而不是“成器技”，N 为该技能<strong>本局游戏的发动次数上限</strong>。每次发动后必须先满足技能末尾写明的“进学”条件，才能再次发动——也就是一条会被自己“进修要求”卡住的成长型技能。</p><ul><li>例：志孙权<span class=\"k-skill\">〖犁海〗</span>“成器（2）…进学：你累计使用四张点数不在<span class=\"k-skill\">〖承帆〗</span>区间内的牌”。</li><li>读法：先看 N（能用几次），再看进学条件（怎么解锁下一次）。</li></ul>","search":"成器技写作&quot;成器（n）&quot;，n 为本局发动次数上限，每次发动后须满足&quot;进学&quot;条件才能继续写作&quot;成器（n）&quot;而不是&quot;成器技&quot;，n 为该技能本局游戏的发动次数上限。每次发动后必须先满足技能末尾写明的&quot;进学&quot;条件，才能再次发动——也就是一条会被自己&quot;进修要求&quot;卡住的成长型技能。- 例：志孙权〖犁海〗&quot;成器（2）…进学：你累计使用四张点数不在〖承帆〗区间内的牌&quot;。- 读法：先看 n（能用几次），再看进学条件（怎么解锁下一次）。"},{"name":"昂扬技","count":"2","sum":"发动后失效，直到满足“激昂”条件才恢复","body":"<p>发动后<strong>技能立即失效</strong>，直到满足该技能写明的“激昂”条件才恢复。描述末尾的“激昂：…”就是这个复位条件。</p><ul><li>例：张昭<span class=\"k-skill\">〖力谏〗</span>“…激昂：X张牌因弃置而进入弃牌堆（X为游戏角色数）”——攒够这个数才重新可用。</li><li>源码释义（国际服）：“昂扬技发动后，技能失效直到满足激昂条件。”</li></ul>","search":"昂扬技发动后失效，直到满足&quot;激昂&quot;条件才恢复发动后技能立即失效，直到满足该技能写明的&quot;激昂&quot;条件才恢复。描述末尾的&quot;激昂：…&quot;就是这个复位条件。- 例：张昭〖力谏〗&quot;…激昂：x张牌因弃置而进入弃牌堆（x为游戏角色数）&quot;——攒够这个数才重新可用。- 源码释义（国际服）：&quot;昂扬技发动后，技能失效直到满足激昂条件。&quot;"},{"name":"契定技","count":"2","sum":"发动一次后自动变成锁定技，描述里的“可以”被删掉","body":"<p>一种会自动“上锁”的标签：发动一次后，本技能的标签由“契定技”改为“锁定技”，并把描述里的“可以”删掉——也就是从“可选”变成“必须”。</p><ul><li>例：贾华<span class=\"k-skill\">〖殚瘁〗</span>“契定技，当你造成伤害时，你可以弃置两张牌，令此伤害+1”，发动过后就变成强制。</li><li>说明：该标签只在 0.5.20 版源码中保留（<code>Skill.Contract</code>），0.5.25 已不再导出，故库内仅 2 条。</li></ul>","search":"契定技发动一次后自动变成锁定技，描述里的&quot;可以&quot;被删掉一种会自动&quot;上锁&quot;的标签：发动一次后，本技能的标签由&quot;契定技&quot;改为&quot;锁定技&quot;，并把描述里的&quot;可以&quot;删掉——也就是从&quot;可选&quot;变成&quot;必须&quot;。- 例：贾华〖殚瘁〗&quot;契定技，当你造成伤害时，你可以弃置两张牌，令此伤害+1&quot;，发动过后就变成强制。- 说明：该标签只在 0.5.20 版源码中保留（skill.contract），0.5.25 已不再导出，故库内仅 2 条。"},{"name":"变身技","count":"0","sum":"靠指示物变身，替换武将牌，两套体力单独计算","body":"<p>技能描述里的条件满足时获得对应“指示物”；指示物满上限即可在对应时机<strong>变身</strong>：弃置判定区内所有牌，武将牌替换为对应的变身武将，原武将与变身武将的体力值<strong>分别单独计算</strong>；指示物消耗到 0 后退出变身、换回原武将牌。</p><ul><li>本库暂未收录（0 条），源码中见于线下“官盗E”系列与“闪耀战姬”两套武将。</li><li>读法：变身是换一套武将牌与技能，不是加 buff；体力各自独立，等于多一条命。</li></ul>","search":"变身技靠指示物变身，替换武将牌，两套体力单独计算技能描述里的条件满足时获得对应&quot;指示物&quot;；指示物满上限即可在对应时机变身：弃置判定区内所有牌，武将牌替换为对应的变身武将，原武将与变身武将的体力值分别单独计算；指示物消耗到 0 后退出变身、换回原武将牌。- 本库暂未收录（0 条），源码中见于线下&quot;官盗e&quot;系列与&quot;闪耀战姬&quot;两套武将。- 读法：变身是换一套武将牌与技能，不是加 buff；体力各自独立，等于多一条命。"},{"name":"对弈技","count":"0","sum":"场上只剩两名角色时才能发动（残局专属开关）","body":"<p>源码里定义的一种发动限制：只有当场上（存活角色）<strong>只剩两名</strong>时，带此标签的技能才能发动。</p><ul><li>来源是源码释义，不是官方规则集里的标签。</li><li>库内暂 0 条：现有数据中没有带此标签的技能。</li></ul>","search":"对弈技源码里定义的一种发动限制：只有当场上（存活角色） 只剩两名 时，带此标签的技能才能发动。 来源是源码释义，不是官方规则集里的标签。 库内暂 0 条：现有数据中没有带此标签的技能。"},{"name":"战场技","count":"7","sum":"满足条件进入战场，在战场内解锁技能效果","body":"<p><strong>一种标签</strong>：满足触发条件进入或退出对应战场，在战场内解锁技能效果。</p><ul><li>战场本质上是一种<strong>武将状态</strong>，并非作用全场的效果，可同时存在不同的战场。</li><li>读法：把“战场”当角色身上的状态看，不是场地牌，也不是全场光环。</li><li>欢乐杀战系列专属。</li></ul>","search":"战场技 一种标签 满足触发条件进入或退出对应战场 在战场内解锁技能效果 战场本质上是一种武将状态 并非作用全场的效果 可同时存在不同的战场"}],"tagNote":"<p>成器技的 3 条按描述中的“成器（N）”计入，源码里未写进 tags 字段，故不在其他标签的统计里。</p><p>另有一类<strong>衍生技</strong>（404 条）：描述中以〖〗提到、但该武将本身并不拥有的技能，库内以 ★ 标注，用于串起“获得/视为拥有”的技能链。</p><ul><li><strong>衍生技</strong>：非游戏标签，是本库为“描述中以〖〗提到但自身没有的技能”设的标注（★）。</li></ul>","terms":[{"name":"3.1 回合与阶段","rows":[["回合","一名角色从回合开始到回合结束的完整流程。","回合一名角色从回合开始到回合结束的完整流程。"],["阶段","回合分准备、判定、摸牌、出牌、弃牌、结束六个阶段。","阶段回合分准备、判定、摸牌、出牌、弃牌、结束六个阶段。"],["准备阶段","回合最前，常触发“准备阶段”类技能，此时未摸牌","准备阶段回合最前，常触发&quot;准备阶段&quot;类技能，此时未摸牌"],["判定阶段","结算判定区内延时锦囊的阶段。","判定阶段结算判定区内延时锦囊的阶段。"],["摸牌阶段","默认摸两张牌的阶段。","摸牌阶段默认摸两张牌的阶段。"],["出牌阶段","使用牌的主要阶段。","出牌阶段使用牌的主要阶段。"],["弃牌阶段","手牌多于手牌上限时弃至上限。","弃牌阶段手牌多于手牌上限时弃至上限。"],["结束阶段","回合收尾，许多“结束阶段”技能在此触发","结束阶段回合收尾，许多&quot;结束阶段&quot;技能在此触发"],["额外回合","在正常流程之外插入的一个完整回合。","额外回合在正常流程之外插入的一个完整回合。"],["每回合 / 每轮","“每回合”按单个角色的回合计；“每轮”按全场角色各过完一个回合计。","每回合 / 每轮“每回合”按单个角色的回合计；“每轮”按全场角色各过完一个回合计。"],["限一次 / 限两次 / 限X次","发动次数上限，作用域由前后文决定（每阶段/每回合/每轮/每局）。","限一次 / 限两次 / 限X次发动次数上限，作用域由前后文决定（每阶段/每回合/每轮/每局）。"],["出杀次数","出牌阶段内使用【杀】的次数上限，默认一次；技能写“次数上限+1”“无次数限制”改的就是它。","出杀次数出牌阶段内使用【杀】的次数上限，默认一次；技能写“次数上限+1”“无次数限制”改的就是它。"]]},{"name":"3.2 区域与牌堆","rows":[["手牌区","手牌所在区域，仅本人可见，明置牌除外。","手牌区手牌所在区域，仅本人可见，明置牌除外。"],["装备区","已装备的武器、防具、坐骑、宝物所在区域，公开可见。","装备区已装备的武器、防具、坐骑、宝物所在区域，公开可见。"],["判定区","放置延时锦囊的区域，判定阶段结算。","判定区放置延时锦囊的区域，判定阶段结算。"],["牌堆","未摸的牌，分“牌堆顶”（摸牌方向）与“牌堆底”（少数技能从底部取）","牌堆未摸的牌，分&quot;牌堆顶&quot;（摸牌方向）与&quot;牌堆底&quot;（少数技能从底部取）"],["弃牌堆","已使用或弃置的牌所在区域，公开可查。","弃牌堆已使用或弃置的牌所在区域，公开可查。"],["处理区","结算过程中牌临时停放的公共区域。使用、打出、拼点、判定都要经过处理区，其中的牌不属于任何角色，结算完成后就离开。","处理区结算过程中牌临时停放的公共区域。使用、打出、拼点、判定都要经过处理区，其中的牌不属于任何角色，结算完成后就离开。"],["武将牌上","放在武将牌上的牌（如“田”“荣”），不属于手牌也不在装备区，等于移出游戏。","武将牌上放在武将牌上的牌（如“田”“荣”），不属于手牌也不在装备区，等于移出游戏。"],["移出游戏","牌离开本局牌堆循环，不再回到任何区域。","移出游戏牌离开本局牌堆循环，不再回到任何区域。"]]},{"name":"3.3 牌的类别与属性","rows":[["基本牌","【杀】【闪】【桃】【酒】等，靠使用或打出直接生效。","基本牌【杀】【闪】【桃】【酒】等，靠使用或打出直接生效。"],["普通锦囊牌","一次性结算的锦囊牌。","普通锦囊牌一次性结算的锦囊牌。"],["延时锦囊牌","先置入判定区、判定阶段才结算的锦囊牌。","延时锦囊牌先置入判定区、判定阶段才结算的锦囊牌。"],["装备牌","置入装备区的牌，分武器、防具、坐骑、宝物。","装备牌置入装备区的牌，分武器、防具、坐骑、宝物。"],["伤害牌","能造成伤害的牌。","伤害牌能造成伤害的牌。"],["同名牌","牌名相同的牌。","同名牌牌名相同的牌。"],["花色","♠黑桃 / ♥红桃 / ♣梅花 / ♦方块。","花色♠黑桃 / ♥红桃 / ♣梅花 / ♦方块。"],["点数","A、2~10、J、Q、K。","点数a、2~10、j、q、k。"],["红色牌 / 黑色牌","按花色分红黑。","红色牌 / 黑色牌按花色分红黑。"]]},{"name":"3.4 使用、结算与响应","rows":[["使用","主动打出并进入结算的用牌方式。","使用主动打出并进入结算的用牌方式。"],["打出","为满足“需要打出”而弃出的牌，不进入结算。","打出为满足“需要打出”而弃出的牌，不进入结算。"],["响应","对他人使用的牌作出应对。","响应对他人使用的牌作出应对。"],["取消 / 抵消","把某个目标移出这张牌的目标列表，它的官方用语是<strong>取消</strong>；“抵消”是玩家口头说法，规则集里不用这个词。所有目标都被取消，这张牌的此时机直接终止。","取消 / 抵消把某个目标移出这张牌的目标列表，它的官方用语是 取消 ；“抵消”是玩家口头说法，规则集里不用这个词。所有目标都被取消，这张牌的此时机直接终止。"],["无效","这张牌对某个目标不生成使用结算开始时、生效前、生效时、生效后这四个时机。与取消的区别：取消是把目标移开，无效是目标还在、流程不发生。","无效这张牌对某个目标不生成使用结算开始时、生效前、生效时、生效后这四个时机。与取消的区别：取消是把目标移开，无效是目标还在、流程不发生。"],["视为","某事物的某项信息以另一种为准：花色、点数、牌名都能“视为”成别的。也用于“视为装备着防具牌”——拥有这件防具的技能，但装备区里没有这张牌。","视为某事物的某项信息以另一种为准：花色、点数、牌名都能“视为”成别的。也用于“视为装备着防具牌”——拥有这件防具的技能，但装备区里没有这张牌。"],["视为使用","不使用实体牌，按某张牌的信息凭空使用或打出。","视为使用不使用实体牌，按某张牌的信息凭空使用或打出。"],["结算","一张牌或一个技能从发动到效果执行完毕的全过程。","结算一张牌或一个技能从发动到效果执行完毕的全过程。"],["自由时点","出牌阶段里没有其他结算正在进行、你可以随时自由发起使用牌的时机。默认的出杀次数限制只卡自由时点的【杀】；技能结算过程中用出的【杀】属于非自由时点，不计入次数。","自由时点出牌阶段里没有其他结算正在进行、你可以随时自由发起使用牌的时机。默认的出杀次数限制只卡自由时点的【杀】；技能结算过程中用出的【杀】属于非自由时点，不计入次数。"],["目标","被牌或技能指向的角色。","目标被牌或技能指向的角色。"],["额外结算","同一张牌再走一遍结算流程。","额外结算同一张牌再走一遍结算流程。"],["若如此做","前一段动作执行了，才结算后一段。","若如此做前一段动作执行了，才结算后一段。"],["至多 / 至少","至多 X 取 0 到 X，可以一个都不选；至少 X 取 X 到上限，X 本身至少为 1。","至多 / 至少至多 x 取 0 到 x，可以一个都不选；至少 x 取 x 到上限，x 本身至少为 1。"],["任意","数量自己定，上下界看它在句子里是条件还是效果。作为条件（你得先付出的代价／前提，如〖制衡〗“弃置任意张牌”再摸等量的牌）时至少为 1，不能取 0，否则等于没发动；作为效果（结算出来的数量，如〖贤膺〗“摸两张牌并弃置任意张牌”）时可以取 0，一张都不弃也合法。","任意数量自己定，上下界看它在句子里是条件还是效果。作为条件（你得先付出的代价／前提，如〖制衡〗“弃置任意张牌”再摸等量的牌）时至少为 1，不能取 0，否则等于没发动；作为效果（结算出来的数量，如〖贤膺〗“摸两张牌并弃置任意张牌”）时可以取 0，一张都不弃也合法。"]]},{"name":"3.5 体力、伤害与死亡","rows":[["体力 / 体力上限","当前体力 / 体力上限；减上限不等于扣体力。","体力 / 体力上限当前体力 / 体力上限；减上限不等于扣体力。"],["已损失体力","体力上限 − 当前体力。","已损失体力体力上限 − 当前体力。"],["手牌上限","弃牌阶段允许保留的手牌数，默认等于当前体力。","手牌上限弃牌阶段允许保留的手牌数，默认等于当前体力。"],["造成伤害 / 受到伤害","伤害的来源方 / 承受方视角。","造成伤害 / 受到伤害伤害的来源方 / 承受方视角。"],["视为造成 / 视为受到伤害","不扣体力，但会进入伤害结算、触发相关技能，并记作“造成过／受到过伤害”，供条件判断和计数使用。","视为造成 视为受到伤害 视为造成过伤害不扣体力，但会进入伤害结算、触发相关技能，并记作“造成过／受到过伤害”，供条件判断和计数使用。"],["防止伤害","该次伤害不发生。","防止伤害该次伤害不发生。"],["失去体力","体力数值下降，但不是伤害，不走伤害结算。","失去体力体力数值下降，但不是伤害，不走伤害结算。"],["回复体力","回复体力，不超过上限。","回复体力回复体力，不超过上限。"],["濒死","体力降至 0 或以下进入濒死，须回复到 1 点以上，否则死亡。","濒死体力降至 0 或以下进入濒死，须回复到 1 点以上，否则死亡。"],["死亡 / 阵亡","未救回则武将死亡；“阵亡”多指武将离场这一事实。","死亡 / 阵亡未救回则武将死亡；“阵亡”多指武将离场这一事实。"],["存活 / 受伤","未死亡 / 体力低于上限。","存活 / 受伤未死亡 / 体力低于上限。"]]},{"name":"3.6 距离与范围","rows":[["距离","按座位计算的最短路径，坐骑可修正（+1 防御马、-1 进攻马）","距离按座位计算的最短路径，坐骑可修正（+1 防御马、-1 进攻马）"],["攻击范围","可指定目标的距离上限，默认为 1，武器牌提升；与“距离”互为参照","攻击范围可指定目标的距离上限，默认为 1，武器牌提升；与&quot;距离&quot;互为参照"],["距离内 / 范围内","以攻击范围判定是否在范围内。","距离内 / 范围内以攻击范围判定是否在范围内。"]]},{"name":"3.7 身份、势力与关系","rows":[["主公","身份模式的核心角色，拥有主公技。","主公身份模式的核心角色，拥有主公技。"],["势力","魏、蜀、吴、群、晋、秦、魔、汉、西等阵营归属。","势力魏、蜀、吴、群、晋、秦、魔、汉、西等阵营归属。"],["登场势力","隐匿、变身武将翻明时确定或声明的势力。","登场势力隐匿、变身武将翻明时确定或声明的势力。"],["阵营 / 友方","模式内的同盟关系。","阵营 / 友方模式内的同盟关系。"],["宗族 / 同族","同一宗族的角色，“同族”是宗族技的对象或条件。","宗族 / 同族同一宗族的角色，“同族”是宗族技的对象或条件。"],["目标角色 / 使用者 / 伤害来源","牌或技能的承受方 / 发起方 / 伤害归属方。","目标角色 / 使用者 / 伤害来源牌或技能的承受方 / 发起方 / 伤害归属方。"],["当前回合角色","正在进行回合的角色。","当前回合角色正在进行回合的角色。"]]},{"name":"3.8 官方规则集用语（V1.0）","rows":[["仓廪","公共区域，牌默认背面朝上放置。技能把牌置入仓廪后，这些牌称“X”；离开仓廪后就不再是“X”。","仓廪公共区域，牌默认背面朝上放置。技能把牌置入仓廪后，这些牌称“x”；离开仓廪后就不再是“x”。"],["府库","公共区域，牌默认正面朝上放置。牌进入府库等同于移出游戏。","府库公共区域，牌默认正面朝上放置。牌进入府库等同于移出游戏。"],["武将牌旁","独立区域，默认正面朝上放置。这里的牌多是其他角色放到你身上的（馈赠或强加），离开后就不再是“X”。","武将牌旁独立区域，默认正面朝上放置。这里的牌多是其他角色放到你身上的（馈赠或强加），离开后就不再是“x”。"],["维系区域","技能里提到的一组牌所在的区域。这些牌一旦离开该区域，此技能就再也辨认不到它们，相关效果不再产生影响，相关条件也不再被满足。","维系区域技能里提到的一组牌所在的区域。这些牌一旦离开该区域，此技能就再也辨认不到它们，相关效果不再产生影响，相关条件也不再被满足。"],["实体牌","实际存在的牌，躺在牌堆、手牌、装备区或弃牌堆这类区域里，有完整的牌面信息：牌名、花色、点数都确定。","实体牌实际存在的牌，躺在牌堆、手牌、装备区或弃牌堆这类区域里，有完整的牌面信息：牌名、花色、点数都确定。"],["虚拟牌","没有与之对应的实体牌，只有一个牌名；使用或打出它，效果等于凭空产生。因为没有实体牌垫底，它也就没有花色和点数，结算完成后即消失。","虚拟牌没有与之对应的实体牌，只有一个牌名；使用或打出它，效果等于凭空产生。因为没有实体牌垫底，它也就没有花色和点数，结算完成后即消失。"],["转换牌","把一张或多张实体牌“当”另一张牌使用或打出，牌面信息按被当成的那张算。它与虚拟牌不同：背后有实体牌垫底，这些牌会一起进处理区，结算完再进弃牌堆；牌被移走或不在本该在的区域，效果就执行不了。","转换牌把一张或多张实体牌“当”另一张牌使用或打出，牌面信息按被当成的那张算。它与虚拟牌不同：背后有实体牌垫底，这些牌会一起进处理区，结算完再进弃牌堆；牌被移走或不在本该在的区域，效果就执行不了。"],["明置 / 暗置","把武将牌翻到正面叫明置（明置状态），翻到背面叫暗置。暗置武将牌的状态类技能无效，其强制发动的技能也可以不发动。","明置 / 暗置把武将牌翻到正面叫明置（明置状态），翻到背面叫暗置。暗置武将牌的状态类技能无效，其强制发动的技能也可以不发动。"],["叠置 / 平置","双将时的摆放：副将在上、主将在下为<strong>叠置</strong>；主将在左、副将在右为<strong>平置</strong>。两者之间切换的操作就叫叠置。","叠置 / 平置双将时的摆放：副将在上、主将在下为 叠置 ；主将在左、副将在右为 平置 。两者之间切换的操作就叫叠置。"],["复原","一次性解除翻面与横置的操作：背面朝上且横置→先重置再翻面；只背面朝上→翻面；只横置→重置；正面且未横置→什么也不发生。","复原一次性解除翻面与横置的操作：背面朝上且横置→先重置再翻面；只背面朝上→翻面；只横置→重置；正面且未横置→什么也不发生。"],["变更","先把自己所有暗置的武将牌明置，再从武将牌堆里取一张同势力的随机武将牌，作为副将的新武将牌（原副将进武将牌堆）。","变更先把自己所有暗置的武将牌明置，再从武将牌堆里取一张同势力的随机武将牌，作为副将的新武将牌（原副将进武将牌堆）。"],["移除","把武将牌置入武将牌堆，该角色改用一张“士兵牌”代替：性别、势力不变，但没有技能、没有姓名，也不能当主将或副将。","移除把武将牌置入武将牌堆，该角色改用一张“士兵牌”代替：性别、势力不变，但没有技能、没有姓名，也不能当主将或副将。"],["连横","出牌阶段空闲时间点，已连横过的牌数 Y 小于 3 时，可连横 X 张带“连横”标识的手牌（X=3-Y）：交给一名势力不同的角色并摸等量的牌，或交给一名没有势力的角色。","连横出牌阶段空闲时间点，已连横过的牌数 y 小于 3 时，可连横 x 张带“连横”标识的手牌（x=3-y）：交给一名势力不同的角色并摸等量的牌，或交给一名没有势力的角色。"],["额定摸牌数","摸牌阶段因流程固定获得的牌数，初值 2；可被“+X / -X / 改为 0”影响，最终最小为 0。为 0 的角色不能再执行“额定摸牌数±”的消耗。","额定摸牌数摸牌阶段因流程固定获得的牌数，初值 2；可被“+x / -x / 改为 0”影响，最终最小为 0。为 0 的角色不能再执行“额定摸牌数±”的消耗。"],["伤害值基数","描述里“造成 X 点伤害”“受到 X 点伤害”的那个 X，是这次伤害的基数；实际伤害要在结算过程中才最终确定。","伤害值基数描述里“造成 x 点伤害”“受到 x 点伤害”的那个 x，是这次伤害的基数；实际伤害要在结算过程中才最终确定。"],["获得 / 得到 / 失去","“获得”是一种<strong>操作</strong>（你主动去拿），“得到”是<strong>结果</strong>（牌真的进了手牌区）；牌离开手牌区或装备区就是“失去”。区分这三者，才能判准“获得时/失去后”这类触发。","获得 / 得到 / 失去“获得”是一种 操作 （你主动去拿），“得到”是 结果 （牌真的进了手牌区）；牌离开手牌区或装备区就是“失去”。区分这三者，才能判准“获得时/失去后”这类触发。"],["置于 / 扣置于","置于＝按目标区域的默认方式放入；扣置于＝明确背面朝上放入。","置于 / 扣置于置于＝按目标区域的默认方式放入；扣置于＝明确背面朝上放入。"],["阵法召唤","阵法技的配套操作：须满足五个条件（有势力且不是野心家、有一张明置且带阵法技的武将牌等）才能召唤，成功后把同队列的角色拉进阵法关系。","阵法召唤阵法技的配套操作：须满足五个条件（有势力且不是野心家、有一张明置且带阵法技的武将牌等）才能召唤，成功后把同队列的角色拉进阵法关系。"],["轮数","游戏初始轮数为 0；座次最小的角色的额定回合一开始，轮数 +1。所以“X 为游戏轮数”在开局第一轮是 0。","轮数游戏初始轮数为 0；座次最小的角色的额定回合一开始，轮数 +1。所以“x 为游戏轮数”在开局第一轮是 0。"],["X、Y、Z","自然数变量。出现在不等式里表示一个条件；作为集合的元素表示执行者可以自己选值；出现在等式里表示必须计算得出。","x、y、z自然数变量。出现在不等式里表示一个条件；作为集合的元素表示执行者可以自己选值；出现在等式里表示必须计算得出。"]]}],"mech":[{"name":"机制词条","rows":[["谋略值","一种通用标记，取值 0~5；大于 0 时自动拥有<span class=\"k-skill\">〖妙计〗</span>，降到 0 即失去。","11","谋略值一种通用标记，取值 0~5；大于 0 时自动拥有 〖妙计〗 ，降到 0 即失去。"],["护甲","独立于体力的防护数值（上限 5），受到伤害时优先减少护甲，无法抵挡体力流失。","21","护甲 独立于体力的防护数值 上限 5 受到伤害时优先减少护甲 无法抵挡体力流失"],["蓄力点","蓄力技的资源，显示为“蓄力 当前/上限”，可攒可花","21","蓄力点蓄力技的资源，显示为&quot;蓄力 当前/上限&quot;，可攒可花"],["道心值","曹髦专属的累积值（上限 99），按 25/50/75/99 解锁“视为拥有”的技能","2","道心值曹髦专属的累积值（上限 99），按 25/50/75/99 解锁&quot;视为拥有&quot;的技能"],["暴虐值","一种标记，当你造成或受到伤害后，你获得1点。上限为5点。","3","暴虐值 一种标记 当你造成或受到伤害后 你获得1点 上限为5点"],["凌越","发动带凌越效果的技能时，若你的凌越数值大于所有目标角色，额外执行凌越效果","1","凌越发动带凌越效果的技能时，若你的凌越数值大于所有目标角色，额外执行凌越效果"],["铸造值","张奋体系资源，把弃牌堆装备牌移出游戏换取，用于按 0/5/10/10 的档位造车","1","铸造值张奋体系资源，把弃牌堆装备牌移出游戏换取，用于按 0/5/10/10 的档位造车"],["大攻车","张奋的器械类装备（含<span class=\"k-card\">【大攻车·进击】</span><span class=\"k-card\">【大攻车·守御】</span>），靠“铸造值”造出来","5","大攻车张奋的器械类装备（含【大攻车·进击】【大攻车·守御】），靠&quot;铸造值&quot;造出来"],["仁区","仁区是一个用于存放牌的公共区域（不属于游戏外）。仁区中的牌上限为6张，当仁区中的牌超过6张时，称为溢出，然后将最先置入仁区的牌置入弃牌堆。","—（仁包引入）","仁区 仁区是一个用于存放牌的公共区域 不属于游戏外 仁区中的牌上限为6张 超过6张时 称为溢出 将最先置入仁区的牌置入弃牌堆"],["智囊","固定三张牌的合称：<span class=\"k-card\">【过河拆桥】</span><span class=\"k-card\">【无懈可击】</span><span class=\"k-card\">【无中生有】</span>","12","智囊固定三张牌的合称：【过河拆桥】【无懈可击】【无中生有】"],["影","<span class=\"k-card\">【影】</span>：♠A 基本牌，本身没有效果、不能被使用；进入弃牌堆即移出游戏，获得时统一从游戏外取","24","影【影】：♠a 基本牌，本身没有效果、不能被使用；进入弃牌堆即移出游戏，获得时统一从游戏外取"],["重铸","置入弃牌堆并摸一张牌（不属于弃置）","86","重铸 置入弃牌堆并摸一张牌 不属于弃置"],["观看 / 亮出 / 展示","观看=自己看；亮出=给全场看但不算“使用”；展示=公开且有触发语义","543","观看 / 亮出 / 展示观看=自己看；亮出=给全场看但不算“使用”；展示=公开且有触发语义"],["卜算","观看牌堆顶 X 张牌，然后以任意顺序把它们放回牌堆顶或牌堆底，等于官方给“小观星”起的封装词。牌面和技能流程里可以直接写一句“卜算X”：如【洞烛先机】就是“卜算2，然后摸两张牌”。","—（官方封装词）","卜算观看牌堆顶 x 张牌，然后以任意顺序把它们放回牌堆顶或牌堆底，等于官方给“小观星”起的封装词。牌面和技能流程里可以直接写一句“卜算x”：如【洞烛先机】就是“卜算2，然后摸两张牌”。"],["拼点","双方各出一张手牌比点数，大者赢，牌进弃牌堆（国际服还有“共同拼点”：所有人一起比，至多一个胜者，点数最大者有多人时视为无胜者）","139","拼点双方各出一张手牌比点数，大者赢，牌进弃牌堆（国际服还有“共同拼点”：所有人一起比，至多一个胜者，点数最大者有多人时视为无胜者）"],["逐鹿","即“共同拼点”：参与者各出一张手牌一起比点数，<strong>至多一个胜者</strong>，点数最大者不止一人时视为无胜者。","9","逐鹿即“共同拼点”：参与者各出一张手牌一起比点数， 至多一个胜者 ，点数最大者不止一人时视为无胜者。"],["延时拼点","拼点牌亮出前，不立刻公布结果，将拼点牌扣置并移出游戏。此回合结束后，若仍未满足公开结果条件，将这些拼点牌置入弃牌堆，且不执行后续拼点流程和时机。","2","延时拼点 拼点牌亮出前 不立刻公布结果 将拼点牌扣置并移出游戏 此回合结束后 若仍未满足公开结果条件 将这些拼点牌置入弃牌堆 且不执行后续拼点流程和时机"],["判定","亮出牌堆顶一张作为判定牌，按结果执行，随后进弃牌堆","198","判定亮出牌堆顶一张作为判定牌，按结果执行，随后进弃牌堆"],["蓄谋","把一张牌扣置入自己的判定区，称为“蓄谋牌”。判定阶段开始时处理顺序是后置入的先处理，逐张亮出并使用，无法使用后所有蓄谋牌置入弃牌堆。同一阶段不能使用牌名相同的蓄谋牌。","5","蓄谋把一张牌扣置入自己的判定区，称为“蓄谋牌”。判定阶段开始时处理顺序是后置入的先处理，逐张亮出并使用，无法使用后所有蓄谋牌置入弃牌堆。同一阶段不能使用牌名相同的蓄谋牌。"],["翻面","武将牌翻面，背面朝上的角色跳过其下个回合（回到正面多在回合开始前）","59","翻面武将牌翻面，背面朝上的角色跳过其下个回合（回到正面多在回合开始前）"],["横置 / 重置","横置=进入“连环状态”，属性伤害可在连环角色间传导；重置=解除","82","横置 / 重置横置=进入“连环状态”，属性伤害可在连环角色间传导；重置=解除"],["连接","一种对手牌的操作，被连接的手牌会对所有角色可见，连接牌属于明置牌。当任意角色一张被连接的牌因使用、打出或弃置离开其手牌区后，所有角色依次弃置其余被连接的牌（此操作不会重复触发该规则的弃置）。当连接的牌再次被连接或离开对应区域后，将重置为正常状态。","5","连接 一种对手牌的操作 被连接的手牌会对所有角色可见 当任意角色一张被连接的牌因使用 打出或弃置离开其手牌区后 所有角色依次弃置其余被连接的牌 此操作不会重复触发该规则的弃置 当连接的牌再次被连接或离开对应区域后 将重置为正常状态 连接牌属于明置牌"],["占有","一种特殊动作，被占有者装备区的牌改为对最后占有者生效。被占有者依旧拥有装备区的牌，相当于出租。占有者可占有多名角色，且自身装备不受影响，但无法占有自己，相当于殖民。","2","占有 一种特殊动作 被占有者装备区的牌改为对最后占有者生效 被占有者依旧拥有装备区的牌 相当于出租 占有者可占有多名角色 且自身装备不受影响 但无法占有自己 相当于殖民"],["搏击 / 游击","位置关系判定：搏击=你与其互为攻击范围内；游击=其在你范围内、你不在其范围内","2 / 2","搏击 / 游击位置关系判定：搏击=你与其互为攻击范围内；游击=其在你范围内、你不在其范围内"],["谋弈","类似猜拳：发动者与目标各从技能给出的选项里秘密选一项，同时公布，再按克制关系定胜负。两人选同一侧则发动者谋弈失败，通常什么也不发生；选得不同则成功，执行所选选项对应的效果。技能一般把两两组合写成一览表，如“镇压-反抗”“安抚-归顺”。",4,"谋弈类似猜拳：发动者与目标各从技能给出的选项里秘密选一项，同时公布，再按克制关系定胜负。两人选同一侧则发动者谋弈失败，通常什么也不发生；选得不同则成功，执行所选选项对应的效果。技能一般把两两组合写成一览表，如“镇压-反抗”“安抚-归顺”。"],["议事","参与者各展示一张手牌表态，按颜色计票，多者为结果（红/黑），并列则无结果。","21","议事参与者各展示一张手牌表态，按颜色计票，多者为结果（红/黑），并列则无结果。"],["整肃","技能发动者从擂进、变阵、鸣止中选择一项令目标执行，若本回合“整肃”成功，则弃牌阶段结束时获得“整肃奖励”。<br>擂进：出牌阶段内，使用的所有牌点数需递增，且至少使用三张牌。<br>变阵：出牌阶段内，使用的所有牌花色需相同，且至少使用两张牌。<br>鸣止：弃牌阶段内，弃置的所有牌花色均不同，且至少弃置两张牌。<br>整肃奖励：摸两张牌或回复1点体力。",5,"整肃 技能发动者从擂进 变阵 鸣止中选择一项令目标执行 若本回合 整肃 成功 则弃牌阶段结束时获得 整肃奖励 擂进 出牌阶段内 使用的所有牌点数需递增 且至少使用三张牌 变阵 出牌阶段内 使用的所有牌花色需相同 且至少使用两张牌 鸣止 弃牌阶段内 弃置的所有牌花色均不同 且至少弃置两张牌 整肃奖励 摸两张牌或回复1点体力"],["强令","向一名角色颁布任务，任务结束时结算奖惩","—（仅源码释义）","强令向一名角色颁布任务，任务结束时结算奖惩"],["同心","游戏开始时选定“同心角色”，执行“同心效果”时你先执行、再由其执行。","2","同心 游戏开始时 选定 同心角色 执行 同心效果 时你先执行 再由其执行"],["施法","给技能挂“施法标记”，回合结束前 -1，归零时执行效果；施法期间不能重复施法同一技能","4","施法给技能挂&quot;施法标记&quot;，回合结束前 -1，归零时执行效果；施法期间不能重复施法同一技能"],["历战","发动过本技能的回合结束后，对技能进行升级或修改，可叠加","2","历战发动过本技能的回合结束后，对技能进行升级或修改，可叠加"],["摧坚","每回合限一次，用伤害牌指定目标后可对其中一名目标发动","1","摧坚每回合限一次，用伤害牌指定目标后可对其中一名目标发动"],["妄行","先选 X（1~4）执行对应效果，结束阶段须弃 X 张牌，否则减体力上限","1","妄行先选 x（1~4）执行对应效果，结束阶段须弃 x 张牌，否则减体力上限"],["背水","一种特殊的选项，选择后依次执行所有选项，最后执行背水选项，一般要付出一些代价。技能里写成“背水：……”。",26,"背水 一种特殊的选项 选择后依次执行所有选项 最后执行背水选项 一般要付出一些代价 技能里写成 背水"],["乘势","一种特殊的附加效果，在多分支效果中，如果满足了所有分支的触发条件，则触发此效果。技能里写成“乘势：……”。",8,"乘势 一种特殊的附加效果 在多分支效果中 如果满足了所有分支的触发条件 则触发此效果 技能里写成 乘势"],["入魔","魔系列武将的机制动作：技能写明的条件（累计记录、造成伤害的次数等）满足后，你可以<strong>入魔</strong>——转入“魔”状态，并随之获得、失去或改写技能，一般不可逆。","7","入魔魔系列武将的机制动作：技能写明的条件（累计记录、造成伤害的次数等）满足后，你可以 入魔 ——转入“魔”状态，并随之获得、失去或改写技能，一般不可逆。"],["入幻","双形态武将的形态切换：满足技能写明的条件即“入幻”，整套技能换成幻形态的一套；对应的“退幻”则复原为开局时的技能。","6","入幻双形态武将的形态切换：满足技能写明的条件即“入幻”，整套技能换成幻形态的一套；对应的“退幻”则复原为开局时的技能。"],["幽思境","魔曹植〖式微〗引入的状态：累积获得七张♣牌即进入“幽思境”，直到你翻面。处于幽思境时，每回合结束时你获得本回合不因使用进入弃牌堆的锦囊牌；若其中有♣牌，你再随机获得一张锦囊牌。","1","幽思境 魔曹植〖式微〗引入的状态：累积获得七张♣牌即进入“幽思境”，直到你翻面。处于幽思境时，每回合结束时你获得本回合不因使用进入弃牌堆的锦囊牌；若其中有♣牌，你再随机获得一张锦囊牌。"]],"search_extra":true}],"cards":[{"name":"杀","n":2042,"t":"基本牌","d":"<b>时机</b>：出牌阶段<br><b>目标</b>：攻击范围内的一名角色<br><b>效果</b>：对目标角色造成1点伤害。","note":""},{"name":"决斗","n":231,"t":"锦囊牌","d":"<b>时机</b>：出牌阶段<br><b>目标</b>：一名其他角色<br><b>效果</b>：由目标角色开始，其与你轮流打出一张<span class=\"kc\">【杀】</span>，直到其与你中的一名角色未打出<span class=\"kc\">【杀】</span>。未打出<span class=\"kc\">【杀】</span>的角色受到其与你中的另一名角色造成的1点伤害。","note":""},{"name":"闪","n":216,"t":"基本牌","d":"<b>时机</b>：<span class=\"kc\">【杀】</span>对你生效时<br><b>目标</b>：此<span class=\"kc\">【杀】</span><br><b>效果</b>：抵消此<span class=\"kc\">【杀】</span>的效果。","note":""},{"name":"酒","n":131,"t":"基本牌","d":"<b>时机</b>：出牌阶段/你处于濒死状态时<br><b>目标</b>：你<br><b>效果</b>：目标角色本回合使用的下一张<span class=\"kc\">【杀】</span>将要造成的伤害+1/目标角色回复1点体力。","note":""},{"name":"桃","n":96,"t":"基本牌","d":"<b>时机</b>：出牌阶段/一名角色处于濒死状态时<br><b>目标</b>：已受伤的你/处于濒死状态的角色<br><b>效果</b>：目标角色回复1点体力。","note":""},{"name":"南蛮入侵","n":61,"t":"锦囊牌","d":"<b>时机</b>：出牌阶段<br><b>目标</b>：所有其他角色<br><b>效果</b>：每名目标角色需打出一张<span class=\"kc\">【杀】</span>，否则受到1点伤害。","note":""},{"name":"无懈可击","n":48,"t":"锦囊牌","d":"<b>时机</b>：锦囊牌对目标角色生效前，或一张<span class=\"kc\">【无懈可击】</span>生效前<br><b>目标</b>：该锦囊牌<br><b>效果</b>：抵消该锦囊牌对该角色产生的效果，或抵消另一张<span class=\"kc\">【无懈可击】</span>产生的效果。","note":""},{"name":"火攻","n":44,"t":"锦囊牌","d":"<b>时机</b>：出牌阶段<br><b>目标</b>：一名有手牌的角色<br><b>效果</b>：目标角色展示一张手牌，然后你可以弃置一张与此牌花色相同的手牌对其造成1点火焰伤害。","note":""},{"name":"无中生有","n":33,"t":"锦囊牌","d":"<b>时机</b>：出牌阶段<br><b>目标</b>：你<br><b>效果</b>：你摸两张牌。","note":""},{"name":"过河拆桥","n":31,"t":"锦囊牌","d":"<b>时机</b>：出牌阶段<br><b>目标</b>：一名有牌的其他角色<br><b>效果</b>：你选择一项：弃置其装备区里的一张牌；或观看其所有手牌并弃置其中一张。","note":""},{"name":"顺手牵羊","n":22,"t":"锦囊牌","d":"<b>时机</b>：出牌阶段<br><b>目标</b>：距离1的一名区域内有牌的角色<br><b>效果</b>：你获得目标角色区域内的一张牌。","note":""},{"name":"万箭齐发","n":22,"t":"锦囊牌","d":"<b>时机</b>：出牌阶段<br><b>目标</b>：所有其他角色<br><b>效果</b>：每名目标角色需打出一张<span class=\"kc\">【闪】</span>，否则受到1点伤害。","note":""},{"name":"铁索连环","n":21,"t":"锦囊牌","d":"<b>时机</b>：出牌阶段<br><b>目标</b>：一至两名角色<br><b>效果</b>：横置或重置目标角色的武将牌。","note":""},{"name":"乐不思蜀","n":19,"t":"延时锦囊牌","d":"<b>时机</b>：出牌阶段<br><b>目标</b>：一名其他角色<br><b>效果</b>：将此牌置于目标角色判定区内。其判定阶段进行判定：若结果不为♥，其跳过出牌阶段。然后将<span class=\"kc\">【乐不思蜀】</span>置入弃牌堆。","note":""},{"name":"闪电","n":18,"t":"延时锦囊牌","d":"<b>时机</b>：出牌阶段<br><b>目标</b>：你<br><b>效果</b>：将此牌置于目标角色判定区内。其判定阶段进行判定：若结果为♠2-9，其受到3点雷电伤害并将<span class=\"kc\">【闪电】</span>置入弃牌堆，否则将<span class=\"kc\">【闪电】</span>移动至其下家判定区内。","note":""},{"name":"五谷丰登","n":15,"t":"锦囊牌","d":"<b>时机</b>：出牌阶段<br><b>目标</b>：所有角色<br><b>效果</b>：亮出牌堆顶等于目标角色数的牌，每名目标角色获得其中一张牌，结算结束后将其余的牌置入弃牌堆。","note":""},{"name":"兵粮寸断","n":14,"t":"延时锦囊牌","d":"<b>时机</b>：出牌阶段<br><b>目标</b>：距离1的一名其他角色<br><b>效果</b>：将此牌置于目标角色判定区内。其判定阶段进行判定：若结果不为♣，其跳过摸牌阶段。然后将<span class=\"kc\">【兵粮寸断】</span>置入弃牌堆。","note":""},{"name":"兵临城下","n":13,"t":"锦囊牌","d":"<b>时机</b>：出牌阶段<br><b>目标</b>：一名其他角色<br><b>效果</b>：你依次亮出牌堆顶四张牌，若为<span class=\"kc\">【杀】</span>，你对目标使用之；若不为<span class=\"kc\">【杀】</span>，将此牌置入弃牌堆。","note":"手杀版本为：展示牌堆顶的四张牌，依次对目标角色使用其中的【杀】，然后将其余的牌以原顺序放回牌堆顶。"},{"name":"八卦阵","n":12,"t":"装备牌 · 防具","d":"<b>防具技能</b>：当你需要使用或打出一张<span class=\"kc\">【闪】</span>时，你可以进行判定：若结果为红色，视为你使用或打出了一张<span class=\"kc\">【闪】</span>。","note":""},{"name":"影","n":9,"t":"基本牌","d":"<b>效果</b>：没有效果，不能被使用。<br>当<span class=\"kc\">【影】</span>进入弃牌堆后移出游戏。<br>当一名角色获得<span class=\"kc\">【影】</span>时，均为从游戏外获得♠A的<span class=\"kc\">【影】</span>。","note":""},{"name":"大攻车","n":8,"t":"装备牌 · 宝物","d":"<b>宝物技能</b>：出牌阶段开始时，你可以视为使用一张<span class=\"kc\">【杀】</span>，当此<span class=\"kc\">【杀】</span>对目标角色造成伤害后，你弃置其一张牌。若此牌未升级，则不能被弃置。离开装备区后销毁。升级选项：<br>1.此<span class=\"kc\">【杀】</span>无视距离和防具；<br>2.此<span class=\"kc\">【杀】</span>可指定目标+1；<br>3.此<span class=\"kc\">【杀】</span>造成伤害后弃牌数+1。","note":"","g":[["张奋","<i>〖拆械〗</i><i>〖渠冲〗</i><i>〖望橹〗</i><i>〖陷筑〗</i>"]]},{"name":"借刀杀人","n":7,"t":"锦囊牌","d":"<b>时机</b>：出牌阶段<br><b>目标</b>：装备区里有武器牌且攻击范围内有<span class=\"kc\">【杀】</span>的合法目标的一名其他角色A（你需要选择一名A攻击范围内的<span class=\"kc\">【杀】</span>的合法目标B）<br><b>效果</b>：A需对B使用一张<span class=\"kc\">【杀】</span>，否则将装备区里的武器牌交给你。","note":""},{"name":"赤血青锋","n":6,"t":"装备牌 · 武器","d":"<b>攻击范围</b>：2<br><b>武器技能</b>：锁定技，你使用<span class=\"kc\">【杀】</span>指定目标后，此<span class=\"kc\">【杀】</span>无视目标角色的防具且目标不能使用或打出手牌，直至此<span class=\"kc\">【杀】</span>结算完毕。","note":"蒲元〖神工〗锻造库；神武再世专属，替换【青釭剑】。","g":[["夏侯恩","<i>〖护剑〗</i><i>〖引锋〗</i>"]]},{"name":"霹雳车（手杀）","n":2,"t":"装备牌 · 武器（攻击范围 9）","d":"<b>宝物技能</b>：当你对其他角色造成伤害后，你可以弃置其装备区内所有装备。离开装备区后不销毁，可以被其他角色获得。","note":"改版后不再限定“防具与+1坐骑”，也不再销毁。","g":[["刘晔","<i>〖破橹〗</i><i>〖筹略〗</i>"]]},{"name":"霹雳车（OL）","n":2,"t":"装备牌 · 武器（攻击范围 9）","d":"<b>宝物技能</b>：当你对其他角色造成伤害后，若造成伤害的牌不为延时锦囊牌，你可以弃置其装备区内的防具牌与 +1 坐骑。当你失去装备区里的【霹雳车】后，此牌销毁。","note":"官渡原版，只能拆防具与 +1 坐骑。","g":[["刘晔","<i>〖平垣〗</i><i>〖料意〗</i>"]]},{"name":"霹雳车（十周年）","n":2,"t":"装备牌 · 宝物","d":"<b>宝物技能</b>：锁定技，当你于回合内使用基本牌时，伤害和回复数值 +1 且无距离限制，使用<span class=\"kc\">【酒】</span>使<span class=\"kc\">【杀】</span>伤害基数值额外 +1。当你于回合外使用或打出基本牌时，摸一张牌。离开装备区时销毁。","note":"","g":[["刘晔","<i>〖破垣〗</i><i>〖画策〗</i>"]]},{"name":"太平要术","n":6,"t":"装备牌 · 防具","d":"<b>防具技能</b>：锁定技，①当你受到属性伤害时，你防止此伤害。②你的手牌上限+X（X为与你势力相同的角色数）。③当你失去装备区里的<span class=\"kc\">【太平要术】</span>后，你摸两张牌，然后若你的体力值大于1，你失去1点体力。","note":"","g":[["谋张角","<i>〖黄天〗</i>"],["南华老仙","<i>〖授术〗</i><i>〖天书〗</i>"]]},{"name":"桃园结义","n":6,"t":"锦囊牌","d":"<b>时机</b>：出牌阶段<br><b>目标</b>：所有角色<br><b>效果</b>：每名目标角色回复1点体力。","note":"","g":[["神关羽","<i>〖武魂〗</i>"],["神刘备","<i>〖桃园〗</i>"]]},{"name":"奇正相生","n":5,"t":"锦囊牌","d":"<b>时机</b>：出牌阶段<br><b>目标</b>：一名其他角色<br><b>效果</b>：当此牌指定目标后，你为其指定“奇兵”或“正兵”。目标角色可以打出一张<span class=\"kc\">【杀】</span>或<span class=\"kc\">【闪】</span>，然后若其为：“奇兵”目标且未打出<span class=\"kc\">【杀】</span>，你对其造成1点伤害；“正兵”目标且未打出<span class=\"kc\">【闪】</span>，你获得其一张牌。","note":"","g":[["神荀彧","<i>〖灵策〗</i><i>〖天佐〗</i>"]]},{"name":"毒","n":4,"t":"基本牌","d":"<b>效果</b>：当<span class=\"kc\">【毒】</span>正面向上离开你的手牌区或作为你的拼点牌亮出后，你失去1点体力。<br>当你因摸牌获得<span class=\"kc\">【毒】</span>后，你可以将之交给一名其他角色，以此法失去<span class=\"kc\">【毒】</span>时不触发失去体力效果。","note":"","g":[["华雌","<i>〖毒医〗</i><i>〖拒疗〗</i><i>〖试药〗</i>"]]},{"name":"青釭剑","n":4,"t":"装备牌 · 武器","d":"<b>攻击范围</b>：２<br><b>武器技能</b>：锁定技，你的<span class=\"kc\">【杀】</span>无视目标角色的防具。","note":""},{"name":"青龙偃月刀","n":4,"t":"装备牌 · 武器","d":"<b>攻击范围</b>：３<br><b>武器技能</b>：当你使用的<span class=\"kc\">【杀】</span>被<span class=\"kc\">【闪】</span>抵消后，你可以对该角色再使用一张<span class=\"kc\">【杀】</span>（不能选择额外目标）。","note":""},{"name":"玄剑","n":4,"t":"装备牌 · 武器","d":"<b>攻击范围</b>：3<br><b>武器技能</b>：你可以将一种花色的所有手牌当<span class=\"kc\">【杀】</span>使用。","note":"","g":[["友徐庶","<i>〖侠行〗</i>"]]},{"name":"彩莲","n":3,"t":"装备牌 · 武器/防具/宝物","d":"<b>攻击范围</b>：1<br><b>装备技能</b>：锁定技，你每轮首次造成的伤害与回复+1，且你与此牌花色相同的手牌不计入手牌上限。","note":"","g":[["孙寒华","<i>〖华光〗</i><i>〖玄白〗</i>"]]},{"name":"出其不意","n":3,"t":"锦囊牌","d":"<b>时机</b>：出牌阶段<br><b>目标</b>：一名有手牌的其他角色<br><b>效果</b>：你展示目标角色的一张手牌，若该牌与此<span class=\"kc\">【出其不意】</span>花色不同，你对其造成1点伤害。","note":"","g":[["杜预","<i>★〖破竹〗</i>"],["姜维","<i>〖复谋〗</i>"]]},{"name":"瞒天过海","n":3,"t":"锦囊牌","d":"<b>时机</b>：出牌阶段<br><b>目标</b>：一至两名区域内有牌的其他角色<br><b>效果</b>：你依次获得目标角色区域内的一张牌，然后依次交给目标角色一张牌。<br><span class=\"kc\">【瞒天过海】</span>不计入你的手牌上限。","note":"","g":[["董昭","<i>〖妙略〗</i>"],["势董昭","<i>〖妙略〗</i>"]]},{"name":"藤甲","n":3,"t":"装备牌 · 防具","d":"<b>防具技能</b>：锁定技。<span class=\"kc\">【南蛮入侵】</span>、<span class=\"kc\">【万箭齐发】</span>和普通<span class=\"kc\">【杀】</span>对你无效。每当你受到火焰伤害时，此伤害+1。","note":""},{"name":"铁蒺藜骨朵","n":3,"t":"装备牌 · 武器","d":"<b>攻击范围</b>：2<br><b>武器技能</b>：准备阶段，你可以将此牌的攻击范围改为X直到回合结束或此牌离开装备区（X为你的体力值）。","note":"","g":[["沙摩柯","<i>〖蛮勇〗</i>"]]},{"name":"推心置腹","n":3,"t":"锦囊牌","d":"<b>时机</b>：出牌阶段<br><b>目标</b>：距离为1的一名区域内有牌的其他角色<br><b>效果</b>：你获得目标角色区域里至多两张牌，然后交给其等量的手牌。","note":"","g":[["刘永","<i>〖丹心〗</i>"],["吕布","<i>〖轻狡〗</i>"]]},{"name":"白银狮子","n":2,"t":"装备牌 · 防具","d":"<b>防具技能</b>：锁定技。每当你受到伤害时，若此伤害大于1点，防止多余的伤害。每当你失去装备区里的<span class=\"kc\">【白银狮子】</span>后，你回复1点体力。","note":"","g":[["马钧","<i>〖精械〗</i>"],["重甲侍卫","<i>〖坚卫〗</i>"]]},{"name":"赤血刃","n":2,"t":"装备牌 · 武器","d":"<b>攻击范围</b>：3（若你未拥有〖神御〗，改为0）<br><b>武器技能</b>：锁定技，每回合首次你的<span class=\"kc\">【杀】</span>对攻击范围内最远角色造成的伤害+1。此牌首次替换其他武器牌后，获得该武器牌的技能。","note":"","g":[["神黄忠","<i>〖神御〗</i>"]]},{"name":"大攻车·进击","n":2,"t":"装备牌 · 武器","d":"<b>攻击范围</b>：9<br><b>耐久度</b>：2<br><b>武器技能</b>：当此牌进入装备区后，弃置你装备区里的其他牌；当其他装备牌进入装备区前，改为将之置入弃牌堆；当你造成伤害时，你可以令此牌减1点耐久度，令此伤害+X（X为游戏轮数且至多为3）；当此牌不因“渠冲”而离开装备区时，防止之，然后此牌-1点耐久度；当此牌耐久度减至0时，销毁此牌。","note":"","g":[["张奋","<i>〖渠冲〗</i><i>〖逊节〗</i>"]]},{"name":"大攻车·守御","n":2,"t":"装备牌 · 武器","d":"<b>攻击范围</b>：9<br><b>耐久度</b>：3<br><b>武器技能</b>：当此牌进入装备区后，弃置你装备区里的其他牌；当其他装备牌进入装备区前，改为将之置入弃牌堆；当你受到伤害时，此牌减等量点耐久度（不足则全减），令此伤害-X（X为减少的耐久度）；当此牌不因“渠冲”而离开装备区时，防止之，然后此牌减1点耐久度；当此牌耐久度减至0时，销毁此牌。","note":"","g":[["张奋","<i>〖渠冲〗</i><i>〖逊节〗</i>"]]},{"name":"调剂盐梅","n":2,"t":"锦囊牌","d":"<b>时机</b>：出牌阶段<br><b>目标</b>：两名手牌数不同的角色<br><b>效果</b>：若所有目标角色的手牌数不均相同，手牌数最小的目标角色摸一张牌，不为的弃置一张手牌。然后若所有目标角色手牌数相同，你可将以此法弃置的牌交给一名角色。","note":"","g":[["费祎","<i>〖生息〗</i>"]]},{"name":"浑天仪","n":2,"t":"装备牌 · 宝物","d":"<b>宝物技能</b>：锁定技，你从装备区里失去此牌时，你摸两张牌并展示，若没有锦囊牌则你再摸一张牌。当你受到伤害时，销毁此牌并防止之。","note":"","g":[["族陆绩","<i>〖该览〗</i>"]]},{"name":"火杀","n":2,"t":"基本牌","d":"<b>时机</b>：出牌阶段<br><b>目标</b>：攻击范围内的一名角色<br><b>效果</b>：对目标角色造成1点火焰伤害。","note":"","g":[["谋周瑜","<i>〖融火〗</i>"]]},{"name":"六龙骖驾","n":2,"t":"装备牌 · 坐骑","d":"<b>坐骑技能</b>：锁定技，其他角色与你的距离+1，你与其他角色的距离-1；当<span class=\"kc\">【六龙骖驾】</span>移至你的装备区后，你将你的装备区里所有其他坐骑牌置入弃牌堆；你不能使用坐骑牌。","note":"","g":[["御曹植","<i>〖冲司〗</i><i>〖辔东〗</i>"]]},{"name":"女装","n":2,"t":"装备牌 · 防具","d":"<b>防具技能</b>：锁定技，若你是男性角色，当你成为<span class=\"kc\">【杀】</span>的目标后，你判定，若结果为黑色，此<span class=\"kc\">【杀】</span>伤害+1。","note":"","g":[["吕玲绮","<i>〖嫁衣〗</i>"],["神黄月英","<i>〖藏巧〗</i>"]]},{"name":"秦弩","n":2,"t":"装备牌 · 武器","d":"<b>攻击范围</b>：9<br><b>武器技能</b>：锁定技，出牌阶段，你使用<span class=\"kc\">【杀】</span>的次数+1；当你使用<span class=\"kc\">【杀】</span>指定一名目标后，你令其防具无效直到此<span class=\"kc\">【杀】</span>结算完毕。","note":"","g":[["秦军弩手","<i>〖劲弩〗</i>"]]},{"name":"仁王盾","n":2,"t":"装备牌 · 防具","d":"<b>防具技能</b>：锁定技，黑色<span class=\"kc\">【杀】</span>对你无效。","note":"","g":[["陈珪陈登","<i>〖鬻主〗</i>"],["马钧","<i>〖精械〗</i>"]]},{"name":"思召剑","n":2,"t":"装备牌 · 武器","d":"<b>攻击范围</b>：2<br><b>武器技能</b>：锁定技，当你使用<span class=\"kc\">【杀】</span>指定一名角色为目标后，该角色不能使用点数小于此<span class=\"kc\">【杀】</span>的<span class=\"kc\">【闪】</span>以抵消此<span class=\"kc\">【杀】</span>。","note":"","g":[["谋袁绍","<i>〖士首〗</i><i>〖玉锋〗</i>"]]},{"name":"趁火打劫","n":1,"t":"锦囊牌","d":"<b>时机</b>：出牌阶段<br><b>目标</b>：一名有手牌的其他角色<br><b>效果</b>：你展示目标角色一张手牌，然后令其选择一项：将此牌交给你，或受到你造成的1点伤害。","note":"","g":[["吕布","<i>〖轻狡〗</i>"]]},{"name":"冲应神符","n":1,"t":"装备牌 · 防具","d":"<b>防具技能</b>：锁定技，①当你受到伤害后，记录造成此伤害的牌的牌名；②当你受到伤害时，若造成此伤害的牌的牌名被记录过，此伤害-1。","note":"","g":[["葛玄","<i>〖司道〗   /* 搜索 */
  var q = $('#q'), hint = $('#hint');
  function filter(){
    var v = q.value.trim().toLowerCase();
    var a = 0, b = 0, m = 0, c = 0;
    $$('.tagcard').forEach(function(el){
      var ok = !v || el.dataset.s.indexOf(v) >= 0;
      el.hidden = !ok; if(ok) a++;
    });
    $$('#termWrap .termgroup').forEach(function(g){
      var n = 0;
      $$('tbody tr', g).forEach(function(tr){
        var ok = !v || tr.dataset.s.indexOf(v) >= 0;
        tr.hidden = !ok; if(ok) n++;
      });
      g.hidden = (n === 0);
      b += n;
    });
    $$('#mechWrap .termgroup').forEach(function(g){
      var n = 0;
      $$('tbody tr', g).forEach(function(tr){
        var ok = !v || tr.dataset.s.indexOf(v) >= 0;
        tr.hidden = !ok; if(ok) n++;
      });
      g.hidden = (n === 0);
      m += n;
    });
    $$('.chip').forEach(function(ch){
      var ok = (!v || ch.dataset.s.indexOf(v) >= 0) && (!curType || ch.dataset.cat === curType);
      ch.hidden = !ok; if(ok) c++;
    });
    $('#tagsEmpty').hidden = !(v && a === 0);
    $('#termsEmpty').hidden = !(v && b === 0);
    $('#mechEmpty').hidden = !(v && m === 0);
    $('#cardsEmpty').hidden = !((v || curType) && c === 0);
    hint.textContent = v ? ('命中：标签 ' + a + ' · 词条 ' + b + ' · 机制 ' + m + ' · 卡牌 ' + c) : '';
  }
  q.addEventListener('input', filter);
  q.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){ q.value = ''; filter(); q.blur(); }
  });

  /* 滚动：进度条 / 回到顶部 / 导航高亮 */
  var bar = $('#bar'), topBtn = $('#top');
  var secs = $$('main .sec'), links = $$('#tabs a');
  function onScroll(){
    var h = document.documentElement;
    var max = h.scrollHeight - h.clientHeight;
    bar.style.transform = 'scaleX(' + (max > 0 ? h.scrollTop / max : 0) + ')';
    topBtn.classList.toggle('show', h.scrollTop > 640);
    var y = window.scrollY + 150, idx = 0;
    secs.forEach(function(s,i){ if(s.offsetTop <= y) idx = i; });
    links.forEach(function(l,i){ l.classList.toggle('on', i === Math.min(idx, links.length-1)); });
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  onScroll();
  topBtn.addEventListener('click', function(){ window.scrollTo({top:0,behavior:'smooth'}); });

  /* 明暗 */
  var themeBtn = $('#theme');
  function applyTheme(t){
    document.documentElement.dataset.theme = t;
    themeBtn.textContent = (t === 'dark') ? '明' : '暗';
    try{ localStorage.setItem('xtheme', t); }catch(err){}
  }
  var saved = null;
  try{ saved = localStorage.getItem('xtheme'); }catch(err){}
  applyTheme(saved === 'dark' ? 'dark' : 'light');
  themeBtn.addEventListener('click', function(){
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  });
})();
</script>
</body>
</html>
